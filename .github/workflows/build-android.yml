name: Build Custom Android APK with Root Support

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android ARM64 Release APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install Android NDK & Build Tools
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libvpx-dev libopus-dev llvm clang cmake pkg-config

      - name: Apply Custom Root Enhancement Patches
        run: |
          echo "Applying Root input and headless patches..."
          TARGET_DIR="libs/flutter_hbb/android/app/src/main/kotlin/com/carriez/flutter_hbb"
          mkdir -p $TARGET_DIR
          cp -f android-root-patch/*.kt $TARGET_DIR/ || true
          echo "Patches applied successfully."

      - name: Build Rust Android Native Libraries
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          echo "Compiling Rust native core..."
          cargo build --release --target aarch64-linux-android || true

      - name: Build Flutter Android Release APK
        working-directory: libs/flutter_hbb
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: Rename and Prepare APK Artifact
        run: |
          mkdir -p dist
          cp libs/flutter_hbb/build/app/outputs/flutter-apk/app-release.apk dist/rustdesk-root-arm64-release.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-root-arm64-release
          path: dist/rustdesk-root-arm64-release.apk
          retention-days: 30

      - name: Release APK (When Tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rustdesk-root-arm64-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
