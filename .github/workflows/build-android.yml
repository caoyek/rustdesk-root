name: Build Custom Android APK with Root Support

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.22.3"
  RUST_VERSION: "1.75"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"

jobs:
  build-android:
    name: Build Android ARM64 Release APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: "rustfmt"

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libvpx-dev libopus-dev llvm clang cmake pkg-config nasm ninja-build libgtk-3-dev libclang-dev

      - name: Install Cargo & Bridge Tools
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          cargo install cargo-ndk --locked

      - name: Generate Flutter Rust Bridge
        run: |
          cd flutter
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml || true
          flutter pub get
          flutter_rust_bridge_codegen --rust-input ../src/flutter_ffi.rs --dart-output ./lib/generated_bridge.dart --dart-decl-output ./lib/generated_bridge.freezed.dart -c ./android/app/src/main/kotlin/com/carriez/flutter_hbb/Bridge.h || true

      - name: Build Rust Android Native Core (librustdesk.so)
        run: |
          cd flutter
          cargo ndk --platform 21 --target aarch64-linux-android build --release --features flutter,hwcodec

      - name: Build Flutter Android Release APK
        run: |
          cd flutter
          flutter build apk --release --target-platform android-arm64

      - name: Rename and Prepare APK Artifact
        run: |
          mkdir -p dist
          cp flutter/build/app/outputs/flutter-apk/app-release.apk dist/rustdesk-root-arm64-release.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-root-arm64-release
          path: dist/rustdesk-root-arm64-release.apk
          retention-days: 30

      - name: Release APK (When Tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rustdesk-root-arm64-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
